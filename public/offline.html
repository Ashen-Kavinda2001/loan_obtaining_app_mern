<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>No Connection — FGI Loans</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e2e8f0;
        padding: 24px;
      }

      .container {
        text-align: center;
        max-width: 380px;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .icon-wrap {
        width: 96px;
        height: 96px;
        background: rgba(124, 58, 237, 0.15);
        border: 2px solid rgba(124, 58, 237, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 28px;
      }

      .icon-wrap svg {
        width: 44px;
        height: 44px;
        color: #7c3aed;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 12px;
      }

      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
        text-decoration: none;
      }

      .btn:hover { opacity: 0.85; }

      .status {
        margin-top: 20px;
        font-size: 12px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3l18 18M8.288 8.288A6 6 0 0115.71 15.71M12 6a6 6 0
            016 6c0 .738-.134 1.442-.378 2.1M4.893 4.893A9.97 9.97 0
            002 12a10 10 0 0010 10 9.97 9.97 0 007.107-2.893" />
        </svg>
      </div>

      <h1>No Internet Connection</h1>
      <p>
        FGI Loan Management requires an active internet connection
        to access loan data, process payments, and send SMS notifications.
        Please check your Wi-Fi or mobile data and try again.
      </p>

      <button class="btn" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0
            0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357
            2H15" />
        </svg>
        Try Again
      </button>

      <p class="status">FGI Loan Management System</p>
    </div>
  </body>
</html>
